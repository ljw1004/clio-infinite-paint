<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 852"
             role="img" aria-labelledby="example-title example-description"
             style="display: block; width: 100%; height: auto; margin-bottom: 0.5em">
            <title id="example-title">Four tiles across three levels of detail</title>
            <desc id="example-description">The root shows a house. Two adjacent
            cells, 119 and 120, contain flowers and a cat, shown enlarged in the
            middle row. Cell 135 of the cat tile contains its bell, shown enlarged
            in the bottom row. The grid and gold outlines mark child positions.</desc>
            <defs>
                <pattern id="example-grid" width="32" height="32" patternUnits="userSpaceOnUse">
                    <path d="M 32 0 H 0 V 32" fill="none" stroke="#b6aa8e" stroke-width="1.5"/>
                </pattern>
                <g id="flower-head" fill="white" stroke="#38342d" stroke-width="6">
                    <circle cy="-22" r="17"/><circle cx="21" cy="-7" r="17"/>
                    <circle cx="13" cy="18" r="17"/><circle cx="-13" cy="18" r="17"/>
                    <circle cx="-21" cy="-7" r="17"/><circle r="8"/>
                </g>
                <symbol id="flowers-sketch" viewBox="0 0 512 512">
                    <rect width="512" height="512" fill="white"/>
                    <g fill="none" stroke="#38342d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 24 488 V 24 H 488 V 488 Z" stroke-width="4"/>
                        <path d="M 236 308 Q 216 230 158 180 M 257 307 Q 275 225 260 115 M 278 309 Q 291 235 352 200"/>
                        <path d="M 222 267 Q 163 267 162 232 Q 202 226 222 267 M 278 274 Q 323 242 342 268 Q 313 301 278 274"/>
                        <path d="M 180 306 Q 256 322 332 306 L 308 440 Q 256 458 204 440 Z" fill="white"/>
                        <path d="M 182 306 Q 256 283 330 306 M 217 344 L 229 417 M 145 458 Q 256 465 365 458"/>
                    </g>
                    <use href="#flower-head" transform="translate(158 180)"/>
                    <use href="#flower-head" transform="translate(260 115)"/>
                    <use href="#flower-head" transform="translate(352 200)"/>
                </symbol>
                <symbol id="bell-sketch" viewBox="0 0 512 512">
                    <rect width="512" height="512" fill="white"/>
                    <g fill="none" stroke="#38342d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 231 108 V 83 Q 256 51 281 83 V 108"/>
                        <path d="M 118 350 Q 162 299 162 218 C 162 70 350 70 350 218 Q 350 299 394 350 Z"/>
                        <path d="M 137 371 Q 256 393 375 371 M 195 215 Q 193 170 223 151 M 234 385 Q 256 427 278 385"/>
                        <path id="example-star" transform="translate(256 256)" d="M 0 -46 L 13 -18 L 44 -14 L 21 7 L 27 37 L 0 22 L -27 37 L -21 7 L -44 -14 L -13 -18 Z"/>
                        <path d="M 89 212 L 65 198 M 91 261 H 58 M 423 212 L 447 198 M 421 261 H 454"/>
                    </g>
                </symbol>
                <symbol id="cat-sketch" viewBox="0 0 512 512">
                    <rect width="512" height="512" fill="white"/>
                    <g fill="none" stroke="#38342d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 24 488 V 24 H 488 V 488 Z" stroke-width="4"/>
                        <path d="M 154 180 L 144 72 L 218 116 Q 256 100 294 116 L 368 72 L 358 180 Q 354 224 308 232 H 204 Q 158 224 154 180 Z"/>
                        <path d="M 168 112 L 177 145 M 344 112 L 335 145 M 196 222 Q 256 244 316 222"/>
                        <path d="M 194 236 Q 139 293 164 412 M 314 236 Q 367 309 332 412 M 332 366 C 436 414 458 318 406 306"/>
                        <path d="M 202 300 L 194 413 M 304 300 L 312 413 M 164 412 Q 195 392 226 421 Q 196 446 164 431 Z M 288 421 Q 316 392 346 412 L 346 431 Q 315 446 288 421"/>
                        <path d="M 184 186 L 102 172 M 185 199 L 102 207 M 328 186 L 410 172 M 327 199 L 410 207"/>
                        <path d="M 244 184 L 268 184 L 256 195 Z M 256 195 Q 242 210 231 199 M 256 195 Q 270 210 281 199"/>
                    </g>
                    <g fill="#38342d"><ellipse cx="210" cy="164" rx="7" ry="10"/><ellipse cx="302" cy="164" rx="7" ry="10"/></g>
                    <use href="#bell-sketch" x="224" y="256" width="32" height="32"/>
                    <path d="M 240 237 V 260" fill="none" stroke="#38342d" stroke-width="2"/>
                </symbol>
                <symbol id="root-sketch" viewBox="0 0 512 512">
                    <rect width="512" height="512" fill="white"/>
                    <g fill="none" stroke="#38342d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 28 438 Q 121 417 220 432 T 484 430 M 128 206 V 424 H 384 V 206 M 104 206 L 256 92 L 408 206 Z"/>
                        <path d="M 326 144 V 88 H 355 V 166 M 240 424 V 320 H 304 V 424"/>
                        <circle cx="286" cy="373" r="4"/>
                        <path d="M 219 219 H 293 V 261 H 219 Z M 215 266 H 297" stroke-width="4"/>
                        <path d="M 72 428 V 332 M 72 352 C 11 342 26 292 58 286 C 39 238 109 233 109 279 C 151 287 136 342 72 352 Z"/>
                        <circle cx="88" cy="87" r="24"/>
                        <path d="M 88 45 V 34 M 88 129 V 140 M 46 87 H 35 M 130 87 H 141" stroke-width="4"/>
                    </g>
                    <use href="#flowers-sketch" x="224" y="224" width="32" height="32"/>
                    <use href="#cat-sketch" x="256" y="224" width="32" height="32"/>
                </symbol>
            </defs>

            <g fill="#f4eacf">
                <path d="M 244 142 L 64 328 H 448 L 268 142 Z"/>
                <path d="M 340 436 L 256 640 H 448 L 352 436 Z"/>
            </g>
            <g stroke="#655c49" stroke-width="1.5">
                <svg x="160" y="46" width="192" height="192" viewBox="0 0 512 512">
                    <use href="#root-sketch" width="512" height="512"/>
                    <rect width="512" height="512" fill="url(#example-grid)" stroke="none"/>
                </svg>
                <rect x="160" y="46" width="192" height="192" fill="none"/>
                <svg x="64" y="328" width="192" height="192" viewBox="0 0 512 512">
                    <use href="#flowers-sketch" width="512" height="512"/>
                    <rect width="512" height="512" fill="url(#example-grid)" stroke="none"/>
                </svg>
                <svg x="256" y="328" width="192" height="192" viewBox="0 0 512 512">
                    <use href="#cat-sketch" width="512" height="512"/>
                    <rect width="512" height="512" fill="url(#example-grid)" stroke="none"/>
                </svg>
                <rect x="64" y="328" width="384" height="192" fill="none"/>
                <path d="M 256 328 V 520"/>
                <svg x="256" y="640" width="192" height="192" viewBox="0 0 512 512">
                    <use href="#bell-sketch" width="512" height="512"/>
                    <rect width="512" height="512" fill="url(#example-grid)" stroke="none"/>
                </svg>
                <rect x="256" y="640" width="192" height="192" fill="none"/>
            </g>
            <g fill="#dba64d" fill-opacity="0.2" stroke="#9d6c25" stroke-width="1.5">
                <rect x="244" y="130" width="12" height="12"/>
                <rect x="256" y="130" width="12" height="12"/>
                <rect x="340" y="424" width="12" height="12"/>
                <path d="M 244 142 L 64 328 M 256 142 V 328 M 268 142 L 448 328 M 340 436 L 256 640 M 352 436 L 448 640" fill="none"/>
            </g>
            <rect x="160" y="2" width="192" height="36" fill="#f4eacf"/>
            <g fill="#24211c" font-family="Georgia, serif" text-anchor="middle" font-size="21">
                <text x="256" y="26">Root · root.png</text>
                <text x="160" y="310">flowers.png</text>
                <text x="352" y="310">cat.png</text>
                <text x="352" y="622">bell.png</text>
            </g>
            <g fill="#81531b" font-family="Georgia, serif" text-anchor="middle" font-size="18">
                <text x="160" y="284">119</text>
                <text x="352" y="284">120</text>
                <text x="352" y="595">135</text>
            </g>
        </svg>
